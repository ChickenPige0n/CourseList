<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f3ed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)">
    <meta name="description" content="SUAT 课程表：按周查看每日课程，支持导入教务系统导出的 ICS 课表，并可导出为日历文件。课程数据仅保存在浏览器本地。">
    <title>SUAT 课程表</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <!-- 在首次绘制前确定主题，避免深色模式闪白 -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('suat-course-theme');
                var theme = (stored === 'light' || stored === 'dark')
                    ? stored
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (e) { /* 隐私模式下忽略 */ }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 字体异步加载：网络不可用时立即回退到系统字体，不阻塞首屏 -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
    </noscript>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
